    mini.hidden = false;
    mini.dataset.section = current.tab;
    mini.innerHTML = `<button class="mini-open" data-action="show-player" aria-label="현재 재생 화면 열기">${art(current, true)}<span class="mini-copy"><strong>${esc(title(current))}</strong><small>${label(current.tab)} · <span id="mini-status">재생 준비</span></small></span></button><button class="icon-button play-toggle" data-action="toggle" aria-label="재생">${icon('play')}</button><button class="icon-button close-mini" data-action="close-mini" aria-label="재생 종료">${icon('close')}</button><span class="mini-line" aria-hidden="true"></span>`;
}

function syncPlayback() {
    updateSleepLabel();
    const playing = hasSource && !audioEl.paused;
    document.querySelectorAll('.play-toggle').forEach(b => { b.innerHTML = icon(playing || loading ? 'pause' : 'play'); b.setAttribute('aria-label', playing || loading ? '일시정지' : '재생'); });
    const status = mediaError ? '재생 실패 · 다시 시도해 주세요' : loading ? '불러오는 중' : playing ? '재생 중' : hasSource && audioEl.ended ? '재생 완료' : hasSource ? '일시정지' : '재생 준비';
    if ($('play-status')) $('play-status').textContent = status;
    if ($('mini-status')) $('mini-status').textContent = status;
    try { if (navigator.mediaSession) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch {}
}

function settings() {
    openDialog('화면 설정', `<div class="setting"><span class="setting-label">화면</span><div class="segments">${[['light', '밝은 화면'], ['dark', '어두운 화면']].map(([v, t]) => `<button class="chip" data-action="pref-mode" data-value="${v}" aria-pressed="${prefs.mode === v}">${t}</button>`).join('')}</div></div><div class="setting"><span class="setting-label">글자 크기</span><div class="segments">${[[1, '기본'], [1.12, '크게'], [1.24, '더 크게']].map(([v, t]) => `<button class="chip" data-action="pref-size" data-value="${v}" aria-pressed="${prefs.size === v}">${t}</button>`).join('')}</div></div>`);
}

function sleepDialog() {
    openDialog('재생 종료 예약', `<div class="sleep-options">${[15, 30, 45, 60].map(n => `<button class="outline-button ${sleepDeadline && sleepMinutes === n ? 'active' : ''}" data-action="set-sleep" data-value="${n}">${n}분 후</button>`).join('')}<button class="outline-button ${sleepAtEnd ? 'active' : ''}" data-action="set-sleep" data-value="end">이번 회차 끝나면</button><button class="outline-button" data-action="set-sleep" data-value="off">예약 해제</button></div><p>브라우저가 백그라운드에서 멈추면 종료가 늦어질 수 있습니다.</p>`);
}

function resetFilters() { search = ''; limit = 24; }

function remember() { if (current) write('elim.last.v3', current.id); }

function minimalClick(e) {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const v = b.dataset.value;
    switch (b.dataset.action) {
    case 'nav': goTab(b.dataset.tab); break;
    case 'open': openEpisode(b.dataset.id); break;
    case 'favorite': toggleFavorite(b.dataset.id); break;
    case 'more': { const offset = $('main-content').scrollTop; limit += 24; renderResults(); $('main-content').scrollTop = offset; document.querySelectorAll('.episode-open')[Math.max(0, limit - 24)]?.focus({ preventScroll: true }); break; }
    case 'clear-search': clearTimeout(searchTimer); search = ''; limit = 24; if ($('search-input')) { $('search-input').value = ''; $('search-input').focus(); } b.hidden = true; renderResults(); break;
    case 'back': navigate(returnRoute, { scroll: returnScroll, focus: true }); break;
    case 'show-player': returnRoute = { ...route }; returnScroll = $('main-content').scrollTop; navigate({ view: 'player', tab: current.tab }); break;
    case 'toggle': toggle(); break;
    case 'seek-relative': seek((pendingSeek ?? (hasSource ? audioEl.currentTime : positions[current?.id] || 0)) + Number(b.dataset.seconds)); break;
    case 'adjacent': adjacent(Number(b.dataset.delta)); break;
    case 'close-mini': savePosition(); switching = true; pause(); audioEl.removeAttribute('src'); audioEl.load(); hasSource = false; current = null; pendingSeek = null; loading = false; switching = false; clearSleep(); write('elim.last.v3', null); if (navigator.mediaSession) { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } document.title = '라디오 엘림'; renderMini(); renderResults(); break;
    case 'settings': settings(); break;
    case 'close-dialog': closeDialog(); break;
    case 'pref-mode': prefs.mode = v; write('elim.preferences.v3', prefs); applyPrefs(); document.querySelectorAll('[data-action="pref-mode"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.value === v))); break;
    case 'pref-size': prefs.size = Number(v); write('elim.preferences.v3', prefs); applyPrefs(); document.querySelectorAll('[data-action="pref-size"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.value === v))); break;
    case 'sleep': sleepDialog(); break;
    case 'set-sleep': setSleep(v); break;
    case 'autoplay': prefs.autoplay = !prefs.autoplay; write('elim.preferences.v3', prefs); b.setAttribute('aria-checked', String(prefs.autoplay)); break;
    }
}

document.addEventListener('click',minimalClick);
document.addEventListener('change',e=>{if(e.target.id==='sort-select'){ascending=e.target.value==='asc';limit=24;renderResults();}});
document.addEventListener('visibilitychange',()=>document.documentElement.toggleAttribute('data-background-paused',document.hidden));
// Restore a paused session without fetching or autoplaying an audio file.
const last=read('elim.last.v3',null);if(byId.has(last)){current=byId.get(last);queue=lists[current.tab].map(e=>e.id);pendingSeek=positions[last]||0;pendingEpisode=last;}
loadRoute();if('ResizeObserver'in window)new ResizeObserver(()=>document.documentElement.style.setProperty('--dock',$('bottom-dock').getBoundingClientRect().height+'px')).observe($('bottom-dock'));
</script>
</body>
</html>
