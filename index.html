</head>
<body class="bg-slate-100 text-slate-800 h-full flex flex-col antialiased selection:bg-blue-900 selection:text-white">

    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-white shadow-2xl relative overflow-hidden border-x border-slate-200">

        <!-- HEADER (박스 제거 및 ELIM 로고 + 텍스트 복구) -->
        <header class="px-5 py-3.5 flex items-center justify-between border-b border-slate-100 bg-white/90 backdrop-blur-md sticky top-0 z-30">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goElim()">
                <div class="h-7 flex items-center">
                    <img src="elim_logo.png" alt="ELIM 로고" class="h-full w-auto object-contain" />
                </div>
                <div class="border-l border-slate-200 pl-3">
                    <h1 class="font-bold text-base tracking-tight text-slate-900 leading-tight">라디오 엘림</h1>
                    <p class="text-[10px] text-blue-950 font-semibold tracking-wide leading-tight">생명의말씀선교회 광주교회</p>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24"></main>

        <!-- MINI PLAYER -->
        <div id="mini-player" class="hidden absolute bottom-16 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-3 flex items-center justify-between z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
            <div class="flex items-center space-x-3 cursor-pointer flex-1 mr-2 min-w-0" onclick="openPlayerFromMini()">
                <div class="min-w-0 flex-1">
                    <h4 id="mini-title" class="text-sm font-semibold truncate text-slate-800">-</h4>
                    <p id="mini-date" class="text-xs text-slate-500 truncate">-</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 flex-shrink-0">
                <button onclick="event.stopPropagation(); togglePlayPause()" id="mini-play-btn" class="w-10 h-10 rounded-full bg-blue-950 hover:bg-blue-900 text-white flex items-center justify-center shadow-md transition-transform active:scale-95">
                    <i class="fa-solid fa-pause text-sm"></i>
                </button>
                <button onclick="event.stopPropagation(); closeMiniPlayer()" class="text-slate-400 hover:text-slate-600 p-2">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-slate-200 px-2 py-2.5 flex justify-around items-center z-20">
            <button onclick="goElim()" id="nav-elim" class="flex flex-col items-center space-y-1 px-4 py-1 transition-colors">
                <i class="fa-solid fa-tower-broadcast text-lg"></i>
                <span class="text-[10px] font-medium">엘림</span>
            </button>
            <button onclick="goSermon()" id="nav-sermon" class="flex flex-col items-center space-y-1 px-4 py-1 transition-colors">
                <i class="fa-solid fa-book-bible text-lg"></i>
                <span class="text-[10px] font-medium">주일말씀</span>
            </button>
            <button onclick="goFavorites()" id="nav-favorites" class="flex flex-col items-center space-y-1 px-4 py-1 transition-colors">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[10px] font-medium">즐겨찾기</span>
            </button>
        </nav>

    // ---------------- State ----------------
    let currentRoute = 'home';
    let currentTab = 'radio'; // 'radio' | 'sermon'
    let sortAscending = false; // false = 최신순
    let searchKeyword = '';
    let currentEpisode = null;
    let currentEpisodeTab = 'radio';
    let isPlaying = false;
    let favorites = [];
    let currentSpeed = 1.0;
    
    // 오디오 객체 전역 싱글톤 선언 및 설정
    let audioEl = window.audioEl || new Audio();
    window.audioEl = audioEl;

    // 잠금화면 / 제어센터에 현재 회차명을 표시
    function decodeHtml(text) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text || '';
        return textarea.value;
    }

    function updateNowPlayingInfo(ep) {
        if (!ep) return;

        const episodeTitle = decodeHtml(ep.title);
        const sectionName = currentEpisodeTab === 'radio' ? '라디오 엘림' : '주일말씀';

        // iOS WKWebView는 웹페이지 제목을 잠금화면 재생 제목으로 사용하는 경우가 있어
        // 재생 직전에 현재 회차명으로 페이지 제목과 audio title을 모두 갱신한다.
        document.title = episodeTitle;
        audioEl.title = episodeTitle;
        audioEl.setAttribute('title', episodeTitle);
        audioEl.setAttribute('aria-label', episodeTitle);

        // Media Session API를 지원하는 환경에서는 더 자세한 메타데이터도 함께 전달한다.
        if ('mediaSession' in navigator && 'MediaMetadata' in window) {
            try {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: episodeTitle,
                    artist: sectionName,
                    album: '생명의말씀선교회 광주교회'
                });
            } catch (e) {
                console.log('Media Session metadata 설정 불가:', e);
            }
        }
    }

    // 오디오 이벤트 바인딩
    audioEl.onended = () => { playAdjacent(1); };
    audioEl.ontimeupdate = () => { updatePlayerProgress(); };
    audioEl.onloadedmetadata = () => {
        updatePlayerProgress();
        if (currentEpisode) updateNowPlayingInfo(currentEpisode);
    };
    audioEl.ondurationchange = () => { updatePlayerProgress(); };
    audioEl.onplay = () => {
        if (currentEpisode) updateNowPlayingInfo(currentEpisode);
        isPlaying = true;
        syncPlayingUI();
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {}
        }
    };
    audioEl.onpause = () => {
        isPlaying = false;
        syncPlayingUI();
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
        }
    };

    window.addEventListener('DOMContentLoaded', render);

    function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }
    function formatTime(totalSeconds) {
        if (!isFinite(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = Math.floor(totalSeconds % 60);
        if (h > 0) {
            return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
        }
        return `${pad2(m)}:${pad2(s)}`;
    }

    function updatePlayerProgress() {
        const slider = document.getElementById('progress-slider');
        const curLabel = document.getElementById('current-time-label');
        const durLabel = document.getElementById('duration-time-label');
        if (!slider || !curLabel || !durLabel) return;
        
        const dur = audioEl.duration || 0;
        slider.max = dur || 100;
        slider.value = audioEl.currentTime || 0;
        curLabel.innerText = formatTime(audioEl.currentTime || 0);
        durLabel.innerText = formatTime(dur);
    }

    function onSeekInput(val) {
        audioEl.currentTime = parseFloat(val);
        updatePlayerProgress();
    }

    function listFor(tab) { return tab === 'radio' ? radioEpisodes : sermonEpisodes; }
    function tabLabel(tab) { return tab === 'radio' ? '라디오 엘림' : '주일 말씀'; }
    function formatDateKo(d) {
        const [y, m, day] = d.split('-');
        return `${y}.${m}.${day}`;
    }

    function getFilteredSorted() {
        let items = listFor(currentTab).slice();
        if (searchKeyword.trim()) {
            const kw = searchKeyword.trim().toLowerCase();
            items = items.filter(ep => ep.title.toLowerCase().includes(kw) || String(ep.num).includes(kw));
        }
        items.sort((a, b) => sortAscending ? a.num - b.num : b.num - a.num);
        return items;
    }

    // ---------------- Navigation ----------------
    function navigate(route) { 
        currentRoute = route; 
        render(); 
    }

    function goElim() { currentTab = 'radio'; searchKeyword = ''; navigate('home'); }
    function goSermon() { currentTab = 'sermon'; searchKeyword = ''; navigate('home'); }
    function goFavorites() { navigate('favorites'); }

    function backToList() { 
        currentTab = currentEpisodeTab; 
        navigate('home'); 
    }

    function openPlayer(tab, id) {
        const ep = listFor(tab).find(e => e.id === id);
        if (!ep) return;
        currentEpisode = ep;
        currentEpisodeTab = tab;
        updateNowPlayingInfo(ep);
        navigate('player');
        playEpisode(ep);
    }
    function openPlayerFromMini() { if (currentEpisode) navigate('player'); }

    // ---------------- Render ----------------
    function render() {
        updateNavStyles();
        document.getElementById('main-content').innerHTML =
            currentRoute === 'home' ? renderHomeView() :
            currentRoute === 'player' ? renderPlayerView() :
            renderFavoritesView();
        updateMiniPlayer();
        attachHomeEvents();
        if (currentRoute === 'player') {
            updatePlayerProgress();
        }
    }

    function updateNavStyles() {
        const relevantTab = currentRoute === 'player' ? currentEpisodeTab : currentTab;
        const activeId =
            currentRoute === 'favorites' ? 'nav-favorites' :
            relevantTab === 'sermon' ? 'nav-sermon' : 'nav-elim';
        ['nav-elim', 'nav-sermon', 'nav-favorites'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.className = "flex flex-col items-center space-y-1 px-4 py-1 transition-colors " +
                    (id === activeId ? "text-blue-950 font-bold" : "text-slate-400 hover:text-slate-600");
            }
        });
    }

    function renderHomeView() {
        const latest = listFor(currentTab).slice().sort((a, b) => b.num - a.num)[0];
        const items = getFilteredSorted();
        return `
            <div class="p-5 space-y-5">
                <!-- HERO / LATEST -->
                <div class="relative rounded-2xl overflow-hidden bg-white border border-slate-200 text-slate-800 p-5 cursor-pointer hover:border-blue-900/30 transition-all shadow-sm" onclick="openPlayer('${currentTab}','${latest.id}')">
                    <div class="flex items-center justify-between mb-3">
                        <span class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-blue-50 text-blue-950 text-xs font-semibold">
                            <span class="w-2 h-2 rounded-full bg-blue-900 animate-pulse"></span>
                            <span>${currentTab === 'radio' ? '최신 회차' : '최신 말씀'}</span>
                        </span>
                        <span class="text-xs text-slate-400">${formatDateKo(latest.date)}</span>
                    </div>
                    <h2 class="text-lg font-bold mb-1 leading-snug text-slate-900">${latest.title}</h2>
                    <div class="flex items-center space-x-2 mt-3">
                        <div class="w-8 h-8 rounded-full bg-blue-950 text-white flex items-center justify-center text-xs shadow-sm">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </div>
                        <span class="text-xs font-semibold text-blue-950">지금 바로 듣기</span>
                    </div>
                </div>

                <!-- SEARCH & SORT -->
                <div class="space-y-2">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input id="search-input" type="text" placeholder="제목이나 회차 번호로 검색해 보세요" value="${searchKeyword}"
                            class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:border-blue-900 focus:bg-white shadow-sm" />
                    </div>
                    <div class="flex justify-end space-x-3 text-xs font-semibold">
                        <button onclick="setSort(false)" class="${!sortAscending ? 'text-blue-950 underline font-bold' : 'text-slate-400'}">최신 순</button>
                        <button onclick="setSort(true)" class="${sortAscending ? 'text-blue-950 underline font-bold' : 'text-slate-400'}">오래된 순</button>
                    </div>
                </div>

                <!-- LIST -->
                <div>
                    <h3 class="font-bold text-sm text-slate-700 mb-3 flex items-center">
                        <i class="fa-solid fa-list-ul text-blue-950 mr-2"></i>${tabLabel(currentTab)} 전체 (${listFor(currentTab).length}개)
                    </h3>
                    <div class="space-y-2.5">
                        ${items.length === 0 ? `<p class="text-center text-slate-400 text-sm py-10">검색 결과가 없습니다 🙇</p>` :
                        items.map(ep => {
                            const isFav = favorites.includes(ep.id);
                            return `
                                <div onclick="openPlayer('${currentTab}','${ep.id}')" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-900/30 cursor-pointer transition-all group">
                                    <div class="flex items-center space-x-3 min-w-0">
                                        <div class="w-11 h-11 rounded-lg bg-blue-950 flex items-center justify-center flex-shrink-0 text-white text-xs font-bold shadow-sm">
                                            ${String(ep.num).includes('.') ? '번외' : ep.num}
                                        </div>
                                        <div class="min-w-0">
                                            <h4 class="font-semibold text-sm text-slate-800 truncate">${ep.title}</h4>
                                            <p class="text-xs text-slate-500 truncate">${formatDateKo(ep.date)}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1 pl-2 flex-shrink-0">
                                        <button onclick="event.stopPropagation(); toggleFavorite('${ep.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition-colors">
                                            <i class="${isFav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'} text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function attachHomeEvents() {
        const input = document.getElementById('search-input');
        if (input) {
            input.addEventListener('input', (e) => {
                searchKeyword = e.target.value;
                const cursorPos = e.target.selectionStart;
                render();
                const newInput = document.getElementById('search-input');
                if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
            });
        }
    }

    function setSort(asc) { sortAscending = asc; render(); }

    function renderPlayerView() {
        if (!currentEpisode) return '';
        const ep = currentEpisode;
        const isFav = favorites.includes(ep.id);
        return `
            <div id="player-card" class="p-5 flex flex-col items-center justify-between min-h-full space-y-4 bg-white">
                <!-- 상단 뒤로가기 & 즐겨찾기 버튼 -->
                <div class="w-full flex items-center justify-between">
                    <button onclick="backToList()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shadow-sm">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </button>
                    <div class="text-center">
                        <span class="text-xs font-semibold text-slate-700">라디오 엘림</span>
                    </div>
                    <button onclick="toggleFavorite('${ep.id}')" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shadow-sm">
                        <i class="${isFav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'} text-sm"></i>
                    </button>
                </div>

                <!-- 라디오 비주얼 카드 -->
                <div class="w-full flex justify-center my-1">
                    <div class="w-56 h-56 bg-blue-950 rounded-3xl p-6 shadow-2xl text-white relative overflow-hidden flex flex-col items-center justify-center border border-blue-900">
                        <div class="w-12 h-12 rounded-full border-2 border-white/80 flex items-center justify-center mb-4 ${isPlaying ? 'animate-pulse' : ''}">
                            <div class="w-4 h-4 rounded-full bg-white shadow-sm"></div>
                        </div>
                        <span class="text-[11px] font-semibold text-slate-300 tracking-widest mb-1">RADIO</span>
                        <h3 class="text-lg font-bold tracking-tight text-white">ELIM</h3>
                    </div>
                </div>

                <!-- 타이틀 및 날짜 정보 -->
                <div class="text-center w-full px-2">
                    <p class="text-xs font-semibold text-slate-400 mb-1">${tabLabel(currentEpisodeTab)}</p>
                    <h2 class="text-lg font-bold text-slate-900 mb-1 leading-snug px-2 line-clamp-2">${ep.title}</h2>
                    <p class="text-xs text-slate-400 font-medium">${formatDateKo(ep.date)}</p>
                </div>

                <!-- PLAYBACK BAR & CONTROLS -->
                <div class="w-full space-y-4 px-1 pb-2">
                    <div>
                        <input id="progress-slider" type="range" min="0" max="100" value="0" step="0.1"
                            oninput="onSeekInput(this.value)"
                            class="w-full h-1.5 rounded-lg cursor-pointer">
                        <div class="flex items-center justify-between mt-2 text-xs font-semibold text-slate-400">
                            <span id="current-time-label">00:00</span>
                            <span id="duration-time-label">00:00</span>
                        </div>
                    </div>

                    <!-- 재생 컨트롤 버튼 레이아웃 -->
                    <div class="flex items-center justify-around px-2">
                        <button onclick="skipSeconds(-15)" class="relative text-slate-500 hover:text-slate-800 p-2 flex flex-col items-center" title="15초 뒤로">
                            <i class="fa-solid fa-rotate-left text-base"></i>
                            <span class="text-[9px] font-bold -mt-0.5">15</span>
                        </button>
                        <button onclick="playAdjacent(-1)" class="text-slate-700 hover:text-blue-950 p-2 text-lg" title="이전 회차">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-blue-950 hover:bg-blue-900 text-white flex items-center justify-center shadow-lg shadow-blue-950/30 text-xl active:scale-95">
                            <i id="player-main-icon" class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}"></i>
                        </button>
                        <button onclick="playAdjacent(1)" class="text-slate-700 hover:text-blue-950 p-2 text-lg" title="다음 회차">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button onclick="skipSeconds(15)" class="relative text-slate-500 hover:text-slate-800 p-2 flex flex-col items-center" title="15초 앞으로">
                            <i class="fa-solid fa-rotate-right text-base"></i>
                            <span class="text-[9px] font-bold -mt-0.5">15</span>
                        </button>
                    </div>
                </div>

                <div class="w-full pb-1"></div>
            </div>
        `;
    }

    function renderFavoritesView() {
        const all = [...radioEpisodes.map(e => ({ ...e, tab: 'radio' })), ...sermonEpisodes.map(e => ({ ...e, tab: 'sermon' }))];
        const favEps = all.filter(e => favorites.includes(e.id));
        return `
            <div class="p-6 space-y-4">
                <h2 class="text-lg font-bold text-slate-800 mb-1 flex items-center">
                    <i class="fa-solid fa-heart text-rose-500 mr-2"></i>즐겨찾기
                </h2>
                ${favEps.length === 0 ? `
                    <div class="text-center py-20 text-slate-400">
                        <i class="fa-regular fa-heart text-4xl mb-3"></i>
                        <p class="text-sm">즐겨찾기한 회차가 없습니다.</p>
                    </div>
                ` : `
                    <div class="space-y-2.5">
                        ${favEps.map(ep => `
                            <div onclick="openPlayer('${ep.tab}','${ep.id}')" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-900/30 cursor-pointer shadow-sm">
                                <div class="flex items-center space-x-3 min-w-0">
                                    <div class="w-11 h-11 rounded-lg bg-blue-950 flex items-center justify-center flex-shrink-0 text-white text-xs font-bold shadow-sm">${String(ep.num).includes('.') ? '번외' : ep.num}</div>
                                    <div class="min-w-0">
                                        <span class="text-[10px] text-blue-900 font-semibold px-1.5 py-0.5 rounded bg-blue-50">${tabLabel(ep.tab)}</span>
                                        <h4 class="font-semibold text-sm text-slate-800 truncate mt-0.5">${ep.title}</h4>
                                        <p class="text-xs text-slate-500 truncate">${formatDateKo(ep.date)}</p>
                                    </div>
                                </div>
                                <button onclick="event.stopPropagation(); toggleFavorite('${ep.id}')" class="text-rose-500 p-2 flex-shrink-0">
                                    <i class="fa-solid fa-heart text-base"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
    }

    // ---------------- Player logic ----------------
    function playEpisode(ep) {
        // 중요: 오디오를 재생하기 전에 제목을 먼저 바꿔야
        // iPhone 잠금화면이 "라디오 엘림" 대신 현재 회차명을 잡기 쉽다.
        updateNowPlayingInfo(ep);

        if (audioEl.src !== ep.src) {
            audioEl.src = ep.src;
            audioEl.load();
        }

        // src/load 뒤에도 한 번 더 적용
        updateNowPlayingInfo(ep);

        audioEl.playbackRate = currentSpeed;
        const p = audioEl.play();
        if (p !== undefined) {
            p.then(() => { 
                updateNowPlayingInfo(ep);
                isPlaying = true; 
                syncPlayingUI();
            }).catch((err) => { 
                console.log("재생 오류 방어:", err);
                isPlaying = false; 
                syncPlayingUI(); 
            });
        }
    }

    function togglePlayPause() {
        if (!currentEpisode) {
            if (radioEpisodes.length) openPlayer('radio', radioEpisodes[0].id);
            return;
        }
        if (audioEl.paused) { 
            audioEl.play().catch(() => {}); 
            isPlaying = true; 
        } else { 
            audioEl.pause(); 
            isPlaying = false; 
        }
        syncPlayingUI();
    }

    function syncPlayingUI() {
        updateMiniPlayer();
        if (currentRoute === 'player') {
            const playIcon = document.getElementById('player-main-icon');
            if (playIcon) {
                playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play ml-0.5';
            }
        }
    }

    function skipSeconds(delta) {
        if (!audioEl) return;
        let newTime = audioEl.currentTime + delta;
        audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || 0, newTime));
        updatePlayerProgress();
    }

    function setSpeed(s) {
        currentSpeed = s;
        audioEl.playbackRate = s;
    }

    function playAdjacent(delta) {
        if (!currentEpisode) return;
        const list = listFor(currentEpisodeTab).slice().sort((a, b) => sortAscending ? a.num - b.num : b.num - a.num);
        const idx = list.findIndex(e => e.id === currentEpisode.id);
        if (idx === -1) return;
        const nextIdx = (idx + delta + list.length) % list.length;
        openPlayer(currentEpisodeTab, list[nextIdx].id);
    }

    function toggleFavorite(id) {
        favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
        render();
    }

    function updateMiniPlayer() {
        const mini = document.getElementById('mini-player');
        if (currentEpisode && (isPlaying || currentRoute !== 'player')) {
            mini.classList.remove('hidden');
            document.getElementById('mini-title').innerText = currentEpisode.title;
            document.getElementById('mini-date').innerText = formatDateKo(currentEpisode.date);
            document.querySelector('#mini-play-btn i').className = isPlaying ? 'fa-solid fa-pause text-sm' : 'fa-solid fa-play text-sm ml-0.5';
        } else {
            mini.classList.add('hidden');
        }
    }

    function closeMiniPlayer() {
        audioEl.pause();
        isPlaying = false;
        currentEpisode = null;
        document.title = '라디오 엘림';
        updateMiniPlayer();
    }

    // 잠금화면 / 제어센터 버튼 제어
    if ('mediaSession' in navigator) {
        try {
            navigator.mediaSession.setActionHandler('play', () => {
                if (!currentEpisode) return;
                updateNowPlayingInfo(currentEpisode);
                audioEl.play().catch(() => {});
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audioEl.pause();
            });
            navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                skipSeconds(-(details.seekOffset || 10));
            });
            navigator.mediaSession.setActionHandler('seekforward', (details) => {
                skipSeconds(details.seekOffset || 10);
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                playAdjacent(-1);
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                playAdjacent(1);
            });
        } catch (e) {
            console.log('Media Session 버튼 설정 불가:', e);
        }
    }
    </script>
</body>
