    // ---------------- State ----------------
    let currentRoute = 'home';

    let searchKeyword = '';
    let currentEpisode = null;
    let currentEpisodeTab = 'radio';
    let isPlaying = false;
    let favorites = readSaved('elim.favorites.v2', []);
    if (!Array.isArray(favorites)) favorites=[];
    let currentSpeed = Number(readSaved('elim.speed.v2', 1));
    if (![0.75,1,1.25,1.5,1.75,2].includes(currentSpeed)) currentSpeed=1;
    let positions = readSaved('elim.positions.v2', {});
    if (!positions || typeof positions !== 'object' || Array.isArray(positions)) positions={};
    let lastSavedAt=0;
    let playRequest=0;
    
    // 오디오 객체 전역 싱글톤 선언 및 설정
    let audioEl = window.audioEl || new Audio();
    window.audioEl = audioEl;
    audioEl.preload="metadata";

    // 잠금화면 / 제어센터에 현재 회차명을 표시
    function decodeHtml(text) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text || '';
        return textarea.value;
    }

    function updateNowPlayingInfo(ep) {
        if (!ep) return;

        const episodeTitle = ep.title;
        const sectionName = currentEpisodeTab === 'radio' ? '라디오 엘림' : '주일말씀';

        // iOS WKWebView는 웹페이지 제목을 잠금화면 재생 제목으로 사용하는 경우가 있어
        // 재생 직전에 현재 회차명으로 페이지 제목과 audio title을 모두 갱신한다.
        document.title = episodeTitle;
        audioEl.title = episodeTitle;
        audioEl.setAttribute('title', episodeTitle);
        audioEl.setAttribute('aria-label', episodeTitle);

        // Media Session API를 지원하는 환경에서는 더 자세한 메타데이터도 함께 전달한다.
        if ('mediaSession' in navigator && 'MediaMetadata' in window) {
            try {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: episodeTitle,
                    artist: sectionName,
                    album: '생명의말씀선교회 광주교회',
                    artwork: ep.youtubeId ? [{src:thumbURL(ep), sizes:'480x360',type:'image/jpeg'}] : []
                });
            } catch (e) {
                console.log('Media Session metadata 설정 불가:', e);
            }
        }
    }

    // 오디오 이벤트 바인딩
    audioEl.onended = () => { if(currentEpisode) { delete positions[currentEpisode.id]; writeSaved('elim.positions.v2',positions); } playAdjacent(1, true); };
    audioEl.ontimeupdate = () => { updatePlayerProgress(); if(Date.now()-lastSavedAt>5000) savePosition(); updatePositionState(); };
    audioEl.onloadedmetadata = () => {
        const saved=Number(positions[currentEpisode?.id]);
        if(Number.isFinite(saved) && saved>0 && Number.isFinite(audioEl.duration) && saved<audioEl.duration-3) audioEl.currentTime=saved;
        updatePlayerProgress();
        if (currentEpisode) updateNowPlayingInfo(currentEpisode);
    };
    audioEl.ondurationchange = () => { updatePlayerProgress(); };
    audioEl.onplay = () => {
        if (currentEpisode) updateNowPlayingInfo(currentEpisode);
        isPlaying = true;
        syncPlayingUI();
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {}
        }
    };
    audioEl.onerror = () => { isPlaying=false; syncPlayingUI(); showMessage("음원을 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 재생해 주세요."); };
    audioEl.onpause = () => {
        if(!audioEl.ended) savePosition();
        isPlaying = false;
        syncPlayingUI();
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
        }
    };

    window.addEventListener('DOMContentLoaded', () => render());

    function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }
    function formatTime(totalSeconds) {
        if (!isFinite(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = Math.floor(totalSeconds % 60);
        if (h > 0) {
            return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
        }
        return `${pad2(m)}:${pad2(s)}`;
    }

    function updatePlayerProgress() {
        const slider = document.getElementById('progress-slider');
        const curLabel = document.getElementById('current-time-label');
        const durLabel = document.getElementById('duration-time-label');
        if (!slider || !curLabel || !durLabel) return;
        
        const dur = Number.isFinite(audioEl.duration) ? audioEl.duration : 0;
        slider.disabled = dur <= 0;
        slider.max = dur || 100;
        slider.value = audioEl.currentTime || 0;
        curLabel.innerText = formatTime(audioEl.currentTime || 0);
        durLabel.innerText = formatTime(dur);
    }

    function onSeekInput(val) {
        if(!Number.isFinite(audioEl.duration) || audioEl.duration<=0) return;
        audioEl.currentTime = Math.max(0,Math.min(audioEl.duration,Number(val)||0));
        updatePlayerProgress();
    }

    function listFor(tab) { return tab === 'radio' ? radioEpisodes : sermonEpisodes; }
    function tabLabel(tab) { return tab === 'radio' ? '라디오 엘림' : '주일 말씀'; }
    function formatDateKo(d) {
        const [y, m, day] = d.split('-');
        return `${y}.${m}.${day}`;
    }

    function getFilteredSorted() {
        let items = listFor(currentTab).slice();
        if (searchKeyword.trim()) {
            const kw = searchKeyword.normalize('NFC').replace(/\s+/g,'').toLowerCase();
            items = items.filter(ep => ep.title.normalize('NFC').replace(/\s+/g,'').toLowerCase().includes(kw) || String(ep.num).includes(kw));
        }
        items.sort((a, b) => sortAscending ? a.date.localeCompare(b.date) || a.num-b.num : b.date.localeCompare(a.date) || b.num-a.num);
        return items;
    }

    // ---------------- Navigation ----------------
    function navigate(route) { 
        currentRoute = route; 
        render(); 
    }

    function goElim() { currentTab = 'radio'; searchKeyword = ''; navigate('home'); }
    function goSermon() { currentTab = 'sermon'; searchKeyword = ''; navigate('home'); }
    function goFavorites() { navigate('favorites'); }

    function backToList() { 
        currentTab = currentEpisodeTab; 
        navigate('home'); 
    }

    function openPlayer(tab, id) {
        const ep = listFor(tab).find(e => e.id === id);
        if (!ep) return;
        if(currentEpisode && currentEpisode.id!==ep.id && !audioEl.ended) savePosition();
        currentEpisode = ep;
        currentEpisodeTab = tab;
        updateNowPlayingInfo(ep);
        navigate('player');
        playEpisode(ep);
    }
    function openPlayerFromMini() { if (currentEpisode) navigate('player'); }

    // ---------------- Render ----------------
    function render() {
        updateNavStyles();
        document.getElementById('main-content').innerHTML =
            currentRoute === 'home' ? renderHomeView() :
            currentRoute === 'player' ? renderPlayerView() :
            renderFavoritesView();
        updateMiniPlayer();
        attachHomeEvents();
        if (currentRoute === 'player') {
            updatePlayerProgress();
        }
    }

    function updateNavStyles() {
        const relevantTab = currentRoute === 'player' ? currentEpisodeTab : currentTab;
        const activeId =
            currentRoute === 'favorites' ? 'nav-favorites' :
            relevantTab === 'sermon' ? 'nav-sermon' : 'nav-elim';
        ['nav-elim', 'nav-sermon', 'nav-favorites'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.className = "flex flex-col items-center space-y-1 px-4 py-1 transition-colors " +
                    (id === activeId ? "text-blue-950 font-bold" : "text-slate-400 hover:text-slate-600");
            }
        });
    }

                <!-- 상단 뒤로가기 & 즐겨찾기 버튼 -->
                <div class="w-full flex items-center justify-between">
                    <button onclick="backToList()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shadow-sm">
                        <i class="fa-solid fa-chevron-down text-sm"></i>
                    </button>
                    <div class="text-center">
                        <span class="text-xs font-semibold text-slate-700">라디오 엘림</span>
                    </div>
                    <button onclick="toggleFavorite('${ep.id}')" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shadow-sm">
                        <i class="${isFav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart'} text-sm"></i>
                    </button>
                </div>

                <!-- 유튜브 원본 썸네일 -->
                <div class="w-full my-1">${thumbnail(ep, 'cover-large', false)}</div>
                ${ep.youtubeId ? `<a href="https://www.youtube.com/watch?v=${ep.youtubeId}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-900 underline">YouTube에서 원본 보기 ↗</a>` : `<p class="text-xs text-slate-500">일치하는 공개 영상의 썸네일을 확인 중입니다.</p>`}
                <!-- 타이틀 및 날짜 정보 -->
                <div class="text-center w-full px-2">
                    <p class="text-xs font-semibold text-slate-400 mb-1">${tabLabel(currentEpisodeTab)}</p>
                    <h2 class="text-lg font-bold text-slate-900 mb-1 leading-snug px-2">${escapeHtml(ep.title)}</h2>
                    <p class="text-xs text-slate-400 font-medium">${formatDateKo(ep.date)}</p>
                </div>

                <!-- PLAYBACK BAR & CONTROLS -->
                <div class="w-full space-y-4 px-1 pb-2">
                    <div>
                        <input id="progress-slider" aria-label="재생 위치" type="range" min="0" max="100" value="0" step="0.1"
                            oninput="onSeekInput(this.value)"
                            class="w-full h-1.5 rounded-lg cursor-pointer">
                        <div class="flex items-center justify-between mt-2 text-xs font-semibold text-slate-400">
                            <span id="current-time-label">00:00</span>
                            <span id="duration-time-label">00:00</span>
                        </div>
                    </div>

                    <!-- 재생 컨트롤 버튼 레이아웃 -->
                    <div class="flex items-center justify-around px-2">
                        <button onclick="skipSeconds(-15)" class="relative text-slate-500 hover:text-slate-800 p-2 flex flex-col items-center" title="15초 뒤로">
                            <i class="fa-solid fa-rotate-left text-base"></i>
                            <span class="text-[9px] font-bold -mt-0.5">15</span>
                        </button>
                        <button onclick="playAdjacent(-1)" class="text-slate-700 hover:text-blue-950 p-2 text-lg" title="이전 회차">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-blue-950 hover:bg-blue-900 text-white flex items-center justify-center shadow-lg shadow-blue-950/30 text-xl active:scale-95">
                            <i id="player-main-icon" class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}"></i>
                        </button>
                        <button onclick="playAdjacent(1)" class="text-slate-700 hover:text-blue-950 p-2 text-lg" title="다음 회차">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button onclick="skipSeconds(15)" class="relative text-slate-500 hover:text-slate-800 p-2 flex flex-col items-center" title="15초 앞으로">
                            <i class="fa-solid fa-rotate-right text-base"></i>
                            <span class="text-[9px] font-bold -mt-0.5">15</span>
                        </button>
                    </div>
                </div>

                <div class="w-full flex items-center justify-center gap-3 pb-4">
                    <label for="speed-select" class="text-sm text-slate-500">재생 속도</label>
                    <select id="speed-select" onchange="setSpeed(Number(this.value))" class="p-2 rounded-xl bg-slate-100 text-sm">
                        ${[0.75,1,1.25,1.5,1.75,2].map(s=>`<option value="${s}" ${s===currentSpeed?'selected':''}>${s}배</option>`).join('')}
                    </select>
                </div>
            </div>
        `;
    }

    function renderFavoritesView() {
        const all = [...radioEpisodes.map(e => ({ ...e, tab: 'radio' })), ...sermonEpisodes.map(e => ({ ...e, tab: 'sermon' }))];
        const favEps = all.filter(e => favorites.includes(e.id));
        return `
            <div class="p-6 space-y-4">
                <h2 class="text-lg font-bold text-slate-800 mb-1 flex items-center">
                    <i class="fa-solid fa-heart text-rose-500 mr-2"></i>즐겨찾기
                </h2>
                ${favEps.length === 0 ? `
                    <div class="text-center py-20 text-slate-400">
                        <i class="fa-regular fa-heart text-4xl mb-3"></i>
                        <p class="text-sm">즐겨찾기한 회차가 없습니다.</p>
                    </div>
                ` : `
                    <div class="space-y-2.5">
                        ${favEps.map(ep => `
                            <div onclick="openPlayer('${ep.tab}','${ep.id}')" class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-900/30 cursor-pointer shadow-sm">
                                <div class="flex items-center space-x-3 min-w-0">
                                    ${thumbnail(ep, 'cover-small')}
                                    <div class="min-w-0">
                                        <span class="text-[10px] text-blue-900 font-semibold px-1.5 py-0.5 rounded bg-blue-50">${tabLabel(ep.tab)}</span>
                                        <h4 class="font-semibold text-sm text-slate-800 truncate mt-0.5">${escapeHtml(ep.title)}</h4>
                                        <p class="text-xs text-slate-500 truncate">${formatDateKo(ep.date)}</p>
                                    </div>
                                </div>
                                <button onclick="event.stopPropagation(); toggleFavorite('${ep.id}')" class="text-rose-500 p-2 flex-shrink-0">
                                    <i class="fa-solid fa-heart text-base"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
    }

    // ---------------- Player logic ----------------
    function playEpisode(ep) {
        updateNowPlayingInfo(ep);
        if (audioEl.getAttribute('src') !== ep.src) {
            audioEl.src = ep.src;
            audioEl.load();
        }
        audioEl.playbackRate = currentSpeed;
        safePlay();
    }
    async function safePlay() {
        const request=++playRequest;
        try {
            if(audioEl.error && currentEpisode) { audioEl.src=currentEpisode.src; audioEl.load(); }
            await audioEl.play();
        } catch(error) {
            if(request!==playRequest || error.name==='AbortError') return;
            isPlaying=false; syncPlayingUI();
            showMessage('재생을 시작하지 못했습니다. 재생 버튼을 다시 눌러 주세요.');
        }
    }
    function togglePlayPause() {
        if(!currentEpisode) { const list=listFor(currentTab); if(list.length) openPlayer(currentTab,list[0].id); return; }
        if(audioEl.paused) safePlay(); else { ++playRequest; audioEl.pause(); }
    }

    function syncPlayingUI() {
        updateMiniPlayer();
        if (currentRoute === 'player') {
            const playIcon = document.getElementById('player-main-icon');
            if (playIcon) {
                playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play ml-0.5';
            }
        }
    }

    function skipSeconds(delta) {
        if (!audioEl || !Number.isFinite(audioEl.duration)) return;
        let newTime = audioEl.currentTime + delta;
        audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || 0, newTime));
        updatePlayerProgress();
    }

    function setSpeed(s) {
        if (![0.75,1,1.25,1.5,1.75,2].includes(s)) return;
        currentSpeed = s;
        audioEl.playbackRate = s;
        writeSaved('elim.speed.v2',s); updatePositionState();
    }

    function playAdjacent(delta, auto = false) {
        if (!currentEpisode) return;
        const list = listFor(currentEpisodeTab).slice().sort((a, b) => sortAscending ? a.date.localeCompare(b.date) || a.num-b.num : b.date.localeCompare(a.date) || b.num-a.num);
        const idx = list.findIndex(e => e.id === currentEpisode.id);
        if (idx === -1) return;
        const nextIdx = idx + delta;
        if(nextIdx<0 || nextIdx>=list.length) { if(!auto) showMessage('마지막 회차입니다.'); return; }
        openPlayer(currentEpisodeTab, list[nextIdx].id);
    }

    function toggleFavorite(id) {
        favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
        writeSaved('elim.favorites.v2',favorites);
        render();
    }

    function updateMiniPlayer() {
        const mini = document.getElementById('mini-player');
        document.getElementById('app').classList.toggle('has-mini', !!currentEpisode && currentRoute!=='player');
        if (currentEpisode && currentRoute !== 'player') {
            mini.classList.remove('hidden');
            document.getElementById('mini-art').innerHTML=thumbnail(currentEpisode,'cover-mini',false);
            document.getElementById('mini-title').innerText = currentEpisode.title;
            document.getElementById('mini-date').innerText = formatDateKo(currentEpisode.date);
            document.querySelector('#mini-play-btn i').className = isPlaying ? 'fa-solid fa-pause text-sm' : 'fa-solid fa-play text-sm ml-0.5';
        } else {
            mini.classList.add('hidden');
        }
    }

    function closeMiniPlayer() {
        savePosition(); ++playRequest; audioEl.pause();
        audioEl.removeAttribute('src'); audioEl.load();
        isPlaying = false;
        currentEpisode = null;
        if('mediaSession' in navigator) { navigator.mediaSession.metadata=null; navigator.mediaSession.playbackState='none'; }
        document.title = '라디오 엘림';
        updateMiniPlayer();
    }

    // 잠금화면 / 제어센터 버튼 제어
    if ('mediaSession' in navigator) {
        try {
            navigator.mediaSession.setActionHandler('play', () => {
                if (!currentEpisode) return;
                updateNowPlayingInfo(currentEpisode);
                safePlay();
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audioEl.pause();
            });
            navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                skipSeconds(-(details.seekOffset || 10));
            });
            navigator.mediaSession.setActionHandler('seekforward', (details) => {
                skipSeconds(details.seekOffset || 10);
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                playAdjacent(-1);
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                playAdjacent(1);
            });
        } catch (e) {
            console.log('Media Session 버튼 설정 불가:', e);
        }
    }

    function escapeHtml(value) { return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function readSaved(key,fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    function writeSaved(key,value) { try { localStorage.setItem(key,JSON.stringify(value)); } catch {} }
    function thumbURL(ep) { return 'https://i.ytimg.com/vi/'+ep.youtubeId+'/hqdefault.jpg'; }
    function placeholder(ep) {
        const label=ep.id.startsWith('sermon')?'주일말씀':'RADIO ELIM';
        return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="640" height="360" rx="20" fill="#172554"/><text x="320" y="155" text-anchor="middle" fill="#fff" font-size="36" font-family="sans-serif">${label}</text><text x="320" y="213" text-anchor="middle" fill="#cbd5e1" font-size="21" font-family="sans-serif">썸네일 준비 중</text></svg>`);
    }
    function thumbnail(ep,classes='',lazy=true) {
        return `<img src="${escapeHtml(ep.youtubeId?thumbURL(ep):placeholder(ep))}" data-episode="${ep.id}" alt="${escapeHtml(ep.title)} 썸네일" class="cover ${classes}" width="480" height="270" loading="${lazy?'lazy':'eager'}" decoding="async" onerror="thumbnailFailed(this)">`;
    }
    function thumbnailFailed(img) {
        img.onerror=null;
        const ep=[...radioEpisodes,...sermonEpisodes].find(e=>e.id===img.dataset.episode);
        if(ep) img.src=placeholder(ep);
    }
    function savePosition() {
        if(!currentEpisode || audioEl.readyState<1 || audioEl.ended) return;
        positions[currentEpisode.id]=audioEl.currentTime;
        writeSaved('elim.positions.v2',positions); lastSavedAt=Date.now();
    }
    function updatePositionState() {
        if(!navigator.mediaSession?.setPositionState || !Number.isFinite(audioEl.duration) || audioEl.duration<=0) return;
        try { navigator.mediaSession.setPositionState({duration:audioEl.duration,playbackRate:audioEl.playbackRate,position:Math.min(audioEl.duration,Math.max(0,audioEl.currentTime))}); } catch {}
    }
    let messageTimer;
    function showMessage(text) {
        const el=document.getElementById('status-message'); el.textContent=text; el.hidden=false;
        clearTimeout(messageTimer); messageTimer=setTimeout(()=>el.hidden=true,6000);
    }
    window.addEventListener('pagehide',savePosition);
    document.addEventListener('visibilitychange',()=>{if(document.hidden) savePosition();});
    if('mediaSession' in navigator) {
        try { navigator.mediaSession.setActionHandler('seekto',d=>{if(Number.isFinite(d.seekTime)) onSeekInput(d.seekTime);}); } catch {}
    }
    const originalRender=render;
    render=function() { originalRender();
        document.querySelectorAll('button:not([aria-label])').forEach(b=>{
            const action=b.getAttribute('onclick')||'';
            if(b.textContent.trim()) return;
            b.setAttribute('aria-label',b.title || (action.includes('Favorite')?'즐겨찾기 전환':action.includes('togglePlay')?'재생 또는 일시정지':action.includes('closeMini')?'재생 종료':'목록으로 돌아가기'));
        });
    };
    </script>
    <div id="status-message" role="status" aria-live="polite" hidden style="position:fixed;z-index:100;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(90%,400px);padding:14px 18px;background:#172554;color:white;border-radius:14px;font-size:14px;box-shadow:0 6px 30px #0003"></div>
</body>
</html>
