name: Update Sermon thumbnails exact

on:
  workflow_dispatch:
  schedule:
    - cron: "35 0 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/update-sermon-thumbnails.yml"

permissions:
  contents: write

jobs:
  update-sermon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Match sermon titles exactly
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          CHANNEL = "https://www.youtube.com/@kwangjuChurch/videos"
          INDEX = Path("index.html")
          OUT = Path("sermon_thumbnails.json")

          if not INDEX.exists():
              print("index.html 없음")
              sys.exit(1)

          html = INDEX.read_text(encoding="utf-8")

          # sermonEpisodes 배열만 잘라냄
          m = re.search(
              r'const\s+sermonEpisodes\s*=\s*\[(.*?)\n\s*\];',
              html,
              flags=re.S
          )

          if not m:
              print("sermonEpisodes 배열을 찾지 못함")
              sys.exit(1)

          block = m.group(1)

          # 객체 안에서 id/title/date만 가져오므로 num 형식이나 다른 필드 변화에 덜 민감함
          episodes = []
          for obj in re.finditer(r'\{(.*?)\}', block, flags=re.S):
              body = obj.group(1)

              id_m = re.search(r'id:\s*"([^"]+)"', body)
              title_m = re.search(r'title:\s*"([^"]*)"', body)
              date_m = re.search(r'date:\s*"([^"]+)"', body)

              if id_m and title_m:
                  episodes.append({
                      "id": id_m.group(1),
                      "title": title_m.group(1),
                      "date": date_m.group(1) if date_m else ""
                  })

          print("앱 주일말씀 수:", len(episodes))

          # 유튜브 채널 영상 정보
          result = subprocess.run(
              [
                  "yt-dlp",
                  "--skip-download",
                  "--dump-json",
                  "--ignore-errors",
                  "--no-warnings",
                  "--playlist-end", "300",
                  CHANNEL
              ],
              text=True,
              capture_output=True,
              check=False
          )

          videos = []
          for line in result.stdout.splitlines():
              try:
                  videos.append(json.loads(line))
              except Exception:
                  pass

          print("유튜브 영상 수:", len(videos))

          def clean_title(s):
              s = s or ""

              # 앞의 "1. ", "31. " 같은 번호는 양쪽 모두 무시
              s = re.sub(r'^\s*\d+(?:\.\d+)?\.\s*', '', s)

              # [주일말씀], (주일말씀), 주일말씀 같은 흔한 접두어 제거
              s = re.sub(r'^\s*[\[\(]?\s*주일\s*말씀\s*[\]\)]?\s*[-_:|]?\s*', '', s, flags=re.I)

              # 목사/목사님, Pa/P 표기 차이는 최대한 동일 취급
              s = re.sub(r'목사님', '목사', s)
              s = re.sub(r'(?i)\bpa\b', '목사', s)
              s = re.sub(r'(?i)\bp\b', '목사', s)

              # 구분기호/공백 차이 제거
              s = s.lower()
              s = re.sub(r'[^0-9a-z가-힣]+', '', s)
              return s

          # 유튜브 제목 정규화 맵
          yt_by_title = {}

          for v in videos:
              vid = v.get("id")
              title = v.get("title") or ""

              if not vid:
                  continue

              key = clean_title(title)

              if key:
                  yt_by_title[key] = v

          existing = {}
          if OUT.exists():
              try:
                  existing = json.loads(OUT.read_text(encoding="utf-8"))
                  if not isinstance(existing, dict):
                      existing = {}
              except Exception:
                  existing = {}

          found = {}
          misses = []

          for ep in episodes:
              key = clean_title(ep["title"])
              video = yt_by_title.get(key)

              if not video:
                  misses.append(ep["title"])
                  continue

              vid = video["id"]

              item = {
                  "videoId": vid,
                  "title": video.get("title") or "",
                  # 웹 목록용으로 안정적인 hqdefault 사용
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                  "youtube": f"https://www.youtube.com/watch?v={vid}"
              }

              # 현재 index.html이 조회하는 키들을 모두 기록
              found[ep["id"]] = item

              if ep["date"]:
                  found[ep["date"]] = item
                  found[f'{ep["date"]}|{ep["title"]}'] = item

              print("MATCH:", ep["title"], "=>", item["title"])

          # 기존 데이터는 유지하고 새 매칭만 덮어씀
          merged = dict(existing)
          merged.update(found)

          OUT.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("")
          print("매칭 성공 키:", len(found))
          print("매칭 실패 말씀 수:", len(misses))

          if misses:
              print("---- 매칭 실패 제목 ----")
              for title in misses:
                  print(title)

          # 하나도 못 찾은 경우 workflow를 실패시켜 원인을 로그에서 바로 보이게 함
          if episodes and not found:
              print("주일말씀 썸네일을 하나도 매칭하지 못했습니다.")
              sys.exit(1)
          PY

      - name: Commit sermon thumbnails
        shell: bash
        run: |
          if git diff --quiet -- sermon_thumbnails.json; then
            echo "변경 사항 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sermon_thumbnails.json
          git commit -m "Update sermon thumbnails"
          git push
