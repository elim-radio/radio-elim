name: Update Sermon thumbnails fuzzy safe

on:
  workflow_dispatch:
  schedule:
    - cron: "35 0 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/update-sermon-thumbnails.yml"

permissions:
  contents: write

jobs:
  update-sermon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Match sermon thumbnails safely
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          from difflib import SequenceMatcher

          CHANNEL = "https://www.youtube.com/@kwangjuChurch/videos"
          INDEX = Path("index.html")
          OUT = Path("sermon_thumbnails.json")

          def norm(s):
              s = (s or "").strip()

              # 앞 번호 제거: 1. / 31. / 31.1.
              s = re.sub(r'^\s*\d+(?:\.\d+)?\.\s*', '', s)

              # 날짜 접두어 제거: [08.09], [2026.08.09], (08-09)
              s = re.sub(
                  r'^\s*[\[\(]\s*(?:20\d{2}[./-])?\d{1,2}[./-]\d{1,2}\s*[\]\)]\s*',
                  '',
                  s
              )

              # [주일말씀], 주일 말씀, (주일말씀) 제거
              s = re.sub(
                  r'^\s*[\[\(]?\s*주일\s*말씀\s*[\]\)]?\s*[-_:|]?\s*',
                  '',
                  s,
                  flags=re.I
              )

              # 반복될 수도 있어서 한 번 더
              s = re.sub(
                  r'^\s*[\[\(]\s*(?:20\d{2}[./-])?\d{1,2}[./-]\d{1,2}\s*[\]\)]\s*',
                  '',
                  s
              )
              s = re.sub(
                  r'^\s*[\[\(]?\s*주일\s*말씀\s*[\]\)]?\s*[-_:|]?\s*',
                  '',
                  s,
                  flags=re.I
              )

              # 목사 표기 통일
              s = s.replace('목사님', '목사')
              s = re.sub(r'(?i)\bpa\b', '목사', s)
              s = re.sub(r'(?i)\bp\b', '목사', s)

              s = s.lower()
              s = re.sub(r'[^0-9a-z가-힣]+', '', s)
              return s

          def split_app_title(title):
              # "설교제목 - 홍길동 목사"
              # "홍길동Pa_본문_설교제목"
              raw = re.sub(r'^\s*\d+(?:\.\d+)?\.\s*', '', title or '').strip()

              speaker = ""
              subject = raw

              # underscore 방식
              parts = [p.strip() for p in raw.split('_') if p.strip()]
              if len(parts) >= 3:
                  speaker = parts[0]
                  subject = " ".join(parts[2:])
              elif len(parts) == 2:
                  # 첫 요소가 사람 이름처럼 보이면 speaker로
                  if re.search(r'(pa|p|목사|목사님)$', parts[0], re.I):
                      speaker = parts[0]
                      subject = parts[1]

              # "제목 - 이름 목사" 방식
              if ' - ' in raw:
                  left, right = raw.rsplit(' - ', 1)
                  if re.search(r'(목사|목사님|pa|p)', right, re.I):
                      subject = left.strip()
                      speaker = right.strip()

              return norm(subject), norm(speaker), norm(raw)

          html = INDEX.read_text(encoding="utf-8")

          m = re.search(
              r'const\s+sermonEpisodes\s*=\s*\[(.*?)\n\s*\];',
              html,
              flags=re.S
          )

          if not m:
              print("sermonEpisodes 배열을 찾지 못했습니다.")
              raise SystemExit(0)

          block = m.group(1)
          episodes = []

          for obj in re.finditer(r'\{(.*?)\}', block, flags=re.S):
              body = obj.group(1)

              id_m = re.search(r'id:\s*"([^"]+)"', body)
              title_m = re.search(r'title:\s*"([^"]*)"', body)
              date_m = re.search(r'date:\s*"([^"]+)"', body)

              if id_m and title_m:
                  episodes.append({
                      "id": id_m.group(1),
                      "title": title_m.group(1),
                      "date": date_m.group(1) if date_m else ""
                  })

          print("앱 주일말씀 수:", len(episodes))

          # 유튜브 목록
          result = subprocess.run(
              [
                  "yt-dlp",
                  "--skip-download",
                  "--dump-json",
                  "--ignore-errors",
                  "--no-warnings",
                  "--playlist-end", "300",
                  CHANNEL
              ],
              text=True,
              capture_output=True,
              check=False
          )

          videos = []
          for line in result.stdout.splitlines():
              try:
                  videos.append(json.loads(line))
              except Exception:
                  pass

          print("유튜브 영상 수:", len(videos))

          existing = {}
          if OUT.exists():
              try:
                  existing = json.loads(OUT.read_text(encoding="utf-8"))
                  if not isinstance(existing, dict):
                      existing = {}
              except Exception:
                  existing = {}

          found = {}
          matched_count = 0
          failed = []

          for ep in episodes:
              subject_key, speaker_key, whole_key = split_app_title(ep["title"])

              best = None
              best_score = -1

              for v in videos:
                  vid = v.get("id")
                  yt_title = v.get("title") or ""

                  if not vid or not yt_title:
                      continue

                  yt_key = norm(yt_title)
                  score = 0

                  # 1) 제목 핵심어가 그대로 포함
                  if subject_key and subject_key in yt_key:
                      score += 100

                  # 2) 목사명 포함
                  if speaker_key and speaker_key in yt_key:
                      score += 60

                  # 3) 전체 제목 유사도
                  score += SequenceMatcher(None, whole_key, yt_key).ratio() * 50

                  # 4) 핵심 제목 유사도
                  if subject_key:
                      score += SequenceMatcher(None, subject_key, yt_key).ratio() * 80

                  # 제목/목사 둘 다 들어가면 사실상 확정
                  if subject_key and speaker_key and subject_key in yt_key and speaker_key in yt_key:
                      score += 100

                  if score > best_score:
                      best_score = score
                      best = v

              # 기준을 너무 빡빡하지 않게 설정
              if best and best_score >= 95:
                  vid = best["id"]

                  item = {
                      "videoId": vid,
                      "title": best.get("title") or "",
                      "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                      "youtube": f"https://www.youtube.com/watch?v={vid}",
                      "score": round(best_score, 1)
                  }

                  found[ep["id"]] = item

                  if ep["date"]:
                      found[ep["date"]] = item
                      found[f'{ep["date"]}|{ep["title"]}'] = item

                  matched_count += 1
                  print("MATCH:", ep["title"], "=>", item["title"], "score=", round(best_score, 1))

              else:
                  failed.append({
                      "app": ep["title"],
                      "best": best.get("title") if best else "",
                      "score": round(best_score, 1)
                  })

          merged = dict(existing)
          merged.update(found)

          OUT.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("")
          print("매칭 성공 말씀 수:", matched_count)
          print("매칭 실패 말씀 수:", len(failed))

          if failed:
              print("---- 매칭 실패/애매한 제목 ----")
              for x in failed:
                  print("APP :", x["app"])
                  print("BEST:", x["best"])
                  print("SCORE:", x["score"])
                  print("---")

          # 중요: 매칭 실패가 있어도 Action 자체는 성공 처리
          # 기존 파일 보존 + 성공한 것만 추가
          PY

      - name: Commit sermon thumbnails
        shell: bash
        run: |
          if git diff --quiet -- sermon_thumbnails.json; then
            echo "변경 사항 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sermon_thumbnails.json
          git commit -m "Update sermon thumbnails"
          git push
