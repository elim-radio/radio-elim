name: Update Sermon thumbnails fixed

on:
  workflow_dispatch:
  schedule:
    - cron: "35 0 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/update-sermon-thumbnails.yml"

permissions:
  contents: write

jobs:
  update-sermon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Match sermon titles
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          CHANNEL = "https://www.youtube.com/@kwangjuChurch/videos"
          INDEX = Path("index.html")
          OUT = Path("sermon_thumbnails.json")

          html = INDEX.read_text(encoding="utf-8")

          m = re.search(
              r'const\s+sermonEpisodes\s*=\s*\[(.*?)\n\s*\];',
              html,
              flags=re.S
          )

          if not m:
              raise SystemExit("sermonEpisodes 배열을 찾지 못했습니다.")

          block = m.group(1)
          episodes = []

          for obj in re.finditer(r'\{(.*?)\}', block, flags=re.S):
              body = obj.group(1)

              id_m = re.search(r'id:\s*"([^"]+)"', body)
              title_m = re.search(r'title:\s*"([^"]*)"', body)
              date_m = re.search(r'date:\s*"([^"]+)"', body)

              if id_m and title_m:
                  episodes.append({
                      "id": id_m.group(1),
                      "title": title_m.group(1),
                      "date": date_m.group(1) if date_m else ""
                  })

          print("앱 주일말씀 수:", len(episodes))

          result = subprocess.run(
              [
                  "yt-dlp",
                  "--skip-download",
                  "--dump-json",
                  "--ignore-errors",
                  "--no-warnings",
                  "--playlist-end", "300",
                  CHANNEL
              ],
              text=True,
              capture_output=True,
              check=False
          )

          videos = []

          for line in result.stdout.splitlines():
              try:
                  videos.append(json.loads(line))
              except Exception:
                  pass

          print("유튜브 영상 수:", len(videos))

          def clean_title(s):
              s = (s or "").strip()

              # 앱 쪽 "31. 제목" 같은 번호 제거
              s = re.sub(r'^\s*\d+(?:\.\d+)?\.\s*', '', s)

              # 유튜브 쪽 "[08.09]" / "[2026.08.09]" / "(08.09)" 같은 날짜 제거
              s = re.sub(
                  r'^\s*[\[\(]\s*(?:20\d{2}[./-])?\d{1,2}[./-]\d{1,2}\s*[\]\)]\s*',
                  '',
                  s
              )

              # "[주일말씀]" 접두어 제거
              s = re.sub(
                  r'^\s*[\[\(]?\s*주일\s*말씀\s*[\]\)]?\s*[-_:|]?\s*',
                  '',
                  s,
                  flags=re.I
              )

              # 혹시 날짜/주일말씀 순서가 반복돼도 한 번 더 정리
              s = re.sub(
                  r'^\s*[\[\(]\s*(?:20\d{2}[./-])?\d{1,2}[./-]\d{1,2}\s*[\]\)]\s*',
                  '',
                  s
              )
              s = re.sub(
                  r'^\s*[\[\(]?\s*주일\s*말씀\s*[\]\)]?\s*[-_:|]?\s*',
                  '',
                  s,
                  flags=re.I
              )

              # 표기 차이 정리
              s = s.replace('목사님', '목사')
              s = re.sub(r'(?i)\bpa\b', '목사', s)
              s = re.sub(r'(?i)\bp\b', '목사', s)

              # 공백/특수문자 무시
              s = s.lower()
              s = re.sub(r'[^0-9a-z가-힣]+', '', s)

              return s

          yt_by_clean_title = {}

          for video in videos:
              vid = video.get("id")
              title = video.get("title") or ""

              if not vid:
                  continue

              key = clean_title(title)

              if key:
                  yt_by_clean_title[key] = video

          existing = {}

          if OUT.exists():
              try:
                  existing = json.loads(OUT.read_text(encoding="utf-8"))
                  if not isinstance(existing, dict):
                      existing = {}
              except Exception:
                  existing = {}

          found = {}
          misses = []

          for ep in episodes:
              key = clean_title(ep["title"])
              video = yt_by_clean_title.get(key)

              if not video:
                  misses.append((ep["title"], key))
                  continue

              vid = video["id"]

              item = {
                  "videoId": vid,
                  "title": video.get("title") or "",
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                  "youtube": f"https://www.youtube.com/watch?v={vid}"
              }

              found[ep["id"]] = item

              if ep["date"]:
                  found[ep["date"]] = item
                  found[f'{ep["date"]}|{ep["title"]}'] = item

              print("MATCH:", ep["title"], "=>", item["title"])

          merged = dict(existing)
          merged.update(found)

          OUT.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("")
          print("매칭 성공 말씀 수:", len(found) // 3 if found else 0)
          print("매칭 실패 말씀 수:", len(misses))

          if misses:
              print("---- 매칭 실패 제목 ----")
              for title, key in misses:
                  print(title, "=>", key)

          # 매칭이 일부라도 되면 정상 종료.
          # 0개인 경우에만 실패 처리해 로그에서 바로 알 수 있게 함.
          if episodes and not found:
              raise SystemExit("주일말씀 썸네일을 하나도 매칭하지 못했습니다.")
          PY

      - name: Commit sermon thumbnails
        shell: bash
        run: |
          if git diff --quiet -- sermon_thumbnails.json; then
            echo "변경 사항 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sermon_thumbnails.json
          git commit -m "Update sermon thumbnails"
          git push
